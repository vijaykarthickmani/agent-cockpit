[package]
name = "agent-cockpit"
version = "0.1.0"
description = "Terminal-first desktop cockpit for interactive CLI coding agents"
authors = ["Thulir Inc"]
edition = "2021"

[lib]
name = "agent_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-pty = "0.3.1"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
